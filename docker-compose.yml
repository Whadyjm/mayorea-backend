services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mayorea
      POSTGRES_PASSWORD: mayorea
      POSTGRES_DB: mayorea
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayorea"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
